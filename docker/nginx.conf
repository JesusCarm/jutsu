# Legacy language links receive the same localized HTML as the canonical route.
map $arg_lang $entry_index {
    default /index.html;
    ~^es$ /es/index.html;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_vary on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    location = /healthz {
        access_log off;
        default_type text/plain;
        add_header Cache-Control "no-store" always;
        return 200 'ok\n';
    }

    location = /runtime-config.js {
        add_header Cache-Control "no-store" always;
        try_files $uri =404;
    }

    location = /build-info.json {
        add_header Cache-Control "no-store" always;
        try_files $uri =404;
    }

    location = /index.html {
        add_header Cache-Control "no-cache" always;
    }

    location = / {
        add_header Cache-Control "no-cache" always;
        try_files $entry_index =404;
    }

    location = /es {
        absolute_redirect off;
        return 301 /es/$is_args$args;
    }

    location = /es/ {
        add_header Cache-Control "no-cache" always;
        try_files /es/index.html =404;
    }

    location = /es/index.html {
        add_header Cache-Control "no-cache" always;
    }

    location = /robots.txt {
        default_type text/plain;
        try_files $uri =404;
    }

    location = /sitemap.xml {
        types { application/xml xml; }
        default_type application/xml;
        try_files $uri =404;
    }

    location /assets/ {
        try_files $uri =404;
    }

    location /i18n/ {
        try_files $uri =404;
    }

    location ~* \.(?:js|css)$ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
