name: Verify and deploy to CapRover

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: caprover-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  publish:
    needs: verify
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.release.outputs.image }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Choose image repository
        id: repository
        shell: bash
        run: printf 'name=ghcr.io/%s\n' "${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - name: Build and publish image
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.repository.outputs.name }}:${{ github.sha }}
          build-args: APP_COMMIT=${{ github.sha }}
          labels: org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Record immutable image
        id: release
        env:
          IMAGE_REPOSITORY: ${{ steps.repository.outputs.name }}
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        run: printf 'image=%s@%s\n' "$IMAGE_REPOSITORY" "$IMAGE_DIGEST" >> "$GITHUB_OUTPUT"
      - name: Smoke-test the published image
        env:
          IMAGE: ${{ steps.release.outputs.image }}
          APP_COMMIT: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          docker run --detach --name jutsu-smoke --publish 127.0.0.1:8080:80 \
            --env GA_MEASUREMENT_ID=G-CITEST0001 "$IMAGE"
          trap 'docker logs jutsu-smoke; docker rm --force jutsu-smoke' EXIT
          curl --fail --retry 20 --retry-connrefused --retry-delay 1 http://127.0.0.1:8080/healthz
          curl --fail http://127.0.0.1:8080/build-info.json | jq --exit-status --arg commit "$APP_COMMIT" '.commit == $commit'
          curl --fail http://127.0.0.1:8080/runtime-config.js | grep --fixed-strings --quiet G-CITEST0001
          curl --fail http://127.0.0.1:8080/a-client-route | grep --fixed-strings --quiet '<app-root>'
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' http://127.0.0.1:8080/assets/missing.json)" = 404

  deploy:
    needs: publish
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
      - name: Check deployment settings
        env:
          CAPROVER_SERVER: ${{ vars.CAPROVER_SERVER }}
          CAPROVER_APP_NAME: ${{ vars.CAPROVER_APP_NAME }}
          CAPROVER_APP_TOKEN: ${{ secrets.CAPROVER_APP_TOKEN }}
          APP_URL: ${{ vars.APP_URL }}
        run: |
          test -n "$CAPROVER_SERVER" || { echo 'Set the CAPROVER_SERVER repository variable.' >&2; exit 1; }
          test -n "$CAPROVER_APP_NAME" || { echo 'Set the CAPROVER_APP_NAME repository variable.' >&2; exit 1; }
          test -n "$CAPROVER_APP_TOKEN" || { echo 'Set the CAPROVER_APP_TOKEN repository secret.' >&2; exit 1; }
          test -n "$APP_URL" || { echo 'Set the APP_URL repository variable.' >&2; exit 1; }
          node --input-type=module <<'JS'
          for (const name of ['CAPROVER_SERVER', 'APP_URL']) {
            const url = new URL(process.env[name]);
            if (url.protocol !== 'https:' || url.username || url.password) {
              throw new Error(`${name} must be an HTTPS URL without embedded credentials.`);
            }
          }
          JS
      - name: Deploy the image to CapRover
        uses: caprover/deploy-from-github@058a3e0d8fb21bfc0ce207b79b1fc757d765a009 # v2
        with:
          server: ${{ vars.CAPROVER_SERVER }}
          app: ${{ vars.CAPROVER_APP_NAME }}
          token: ${{ secrets.CAPROVER_APP_TOKEN }}
          image: ${{ needs.publish.outputs.image }}
      - name: Verify the deployed release
        env:
          APP_URL: ${{ vars.APP_URL }}
          APP_COMMIT: ${{ github.sha }}
        run: node scripts/wait-for-deployment.mjs
