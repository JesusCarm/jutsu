  <text x="150" y="25" text-anchor="middle">=</text>

  <rect x="182" y="10" width="18" height="18" rx="2" fill="white" stroke="#222"/>
  <circle cx="191" cy="19" r="1.5" fill="#222"/>
  <circle cx="187" cy="15" r="1.5" fill="#222"/>
  <circle cx="195" cy="15" r="1.5" fill="#222"/>
  <circle cx="187" cy="23" r="1.5" fill="#222"/>
  <rect x="208" y="10" width="18" height="18" rx="2" fill="white" stroke="#222"/>
  <circle cx="213" cy="15" r="1.5" fill="#222"/>
  <circle cx="221" cy="23" r="1.5" fill="#222"/>
  <text x="204" y="22" text-anchor="middle">&gt;</text>
  <path d="M229 19 L252 19" fill="none" stroke="#222" stroke-width="1.4" marker-end="url(#arr)"/>
  <circle cx="269" cy="19" r="11" fill="white" stroke="#222"/>
  <text x="269" y="22.5" text-anchor="middle">I</text>
