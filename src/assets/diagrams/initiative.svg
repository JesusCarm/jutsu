  <circle cx="98" cy="22" r="11" fill="white" stroke="#222"/>
  <text x="98" y="25.5" text-anchor="middle">I</text>

  <!-- separator -->
  <path d="M122 6 L122 38" stroke="#222" stroke-dasharray="2 2"/>

  <!-- case 2: tie -> higher d6 -->
  <circle cx="138" cy="14" r="5" fill="white" stroke="#222"/>
  <circle cx="138" cy="30" r="5" fill="white" stroke="#222"/>
  <circle cx="162" cy="14" r="5" fill="#222" stroke="#222"/>
