    <a href="https://www.instagram.com/gipsygames/" target="_blank" rel="noopener noreferrer">{{ i18n.t(Footer.instagram) }}</a>
    <a href="https://github.com/JesusCarm/jutsu" target="_blank" rel="noopener noreferrer">{{ i18n.t(Footer.github) }}</a>
    <a href="https://gipsygames.com/" target="_blank" rel="noopener noreferrer">{{ i18n.t(App.publisher) }}</a>
