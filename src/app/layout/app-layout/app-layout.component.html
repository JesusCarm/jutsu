<a class="skip-link" href="#main-content">{{ i18n.t(App.skip) }}</a>
<main id="main-content" class="container main-content"><ng-content /></main>
<footer class="site-footer container">
  <p class="footer-brand">{{ i18n.t(App.product) }} <span class="app-version">{{ i18n.t(Footer.version, {version}) }}</span></p>
  <nav class="footer-links" [attr.aria-label]="i18n.t(Footer.links)">
    <a href="https://www.patreon.com/GipsyGames/?utm_source=jutsu_app&utm_medium=referral&utm_campaign=jutsu&utm_content=footer" target="_blank" rel="noopener noreferrer">{{ i18n.t(Footer.patreon) }}</a>
    <a href="https://www.myminifactory.com/profile/gipsygames?utm_source=jutsu_app&utm_medium=referral&utm_campaign=jutsu&utm_content=footer" target="_blank" rel="noopener noreferrer">{{ i18n.t(Footer.myMiniFactory) }}</a>
    <a href="https://www.instagram.com/gipsygames/?utm_source=jutsu_app&utm_medium=referral&utm_campaign=jutsu&utm_content=footer" target="_blank" rel="noopener noreferrer">{{ i18n.t(Footer.instagram) }}</a>
    <a href="https://github.com/JesusCarm/jutsu?utm_source=jutsu_app&utm_medium=referral&utm_campaign=jutsu&utm_content=footer" target="_blank" rel="noopener noreferrer">{{ i18n.t(Footer.github) }}</a>
    <a href="https://gipsygames.com/?utm_source=jutsu_app&utm_medium=referral&utm_campaign=jutsu&utm_content=footer" target="_blank" rel="noopener noreferrer">{{ i18n.t(App.publisher) }}</a>
    @if (analytics.enabled) {
      <button class="analytics-settings" type="button" [attr.aria-expanded]="analytics.showConsent()" (click)="analytics.openPreferences()">{{ i18n.t(Analytics.settings) }}</button>
    }
  </nav>
</footer>
<app-analytics-consent />
