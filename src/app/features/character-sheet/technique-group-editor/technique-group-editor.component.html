<fieldset class="form-section technique-editor"><legend><app-ui-icon name="book" />{{ i18n.t(Labels.jutsuSchool) }}</legend>
  <app-catalog-select [label]="i18n.t(Labels.jutsuSchool)" [hideLabel]="true" [placeholder]="i18n.t(Labels.chooseSchool)"
    [controlId]="'ninja-' + (ninjaIndex() + 1) + '-technique-group'" [options]="options()" [value]="group().id"
    (selected)="state.selectGroup(ninjaIndex(), $event)" />
  <div class="technique-list">
    @for (technique of techniques(); track $index) {
      <article class="technique-card">
        <div class="technique-heading"><h3>{{ technique.name }}</h3><span class="chakra-cost" [title]="i18n.t(Labels.chakraCost)"><app-ui-icon name="chakra" /><span class="sr-only">{{ i18n.t(Stats.chakra) }}: </span>{{ technique.chakra }}</span></div>
        <p>{{ technique.description }}</p>
        @if (technique.isMokushin) { <span class="mokushin-badge"><app-ui-icon name="mokushin" />{{ i18n.t(Labels.mokushin) }}</span> }
      </article>
    } @empty { <p class="empty-techniques">{{ i18n.t(Labels.emptyTechniques) }}</p> }
  </div>
</fieldset>
