<div class="technique-list">
    @for (technique of techniques(); track $index) {
      <article class="technique-card">
        <div class="technique-heading"><h3>{{ technique.name }}@if (technique.rule; as rule) { <app-rule-help [rule]="rule" [label]="technique.name" /> }</h3><span class="chakra-cost" [title]="i18n.t(Labels.chakraCost)"><app-ui-icon name="chakra" /><span class="sr-only">{{ i18n.t(Stats.chakra) }}: </span>{{ technique.chakra }}</span></div>
        <p><app-rule-text [text]="technique.description" (selectedRule)="rules.open($event)" /></p>
        @if (technique.isMokushin) { <button type="button" class="mokushin-badge" aria-haspopup="dialog" data-rule-id="mokushin" [title]="i18n.t(Labels.mokushin)" (click)="rules.open('mokushin')"><app-ui-icon name="mokushin" />{{ i18n.t(Labels.mokushin) }}</button> }
      </article>
    } @empty { <p class="empty-techniques">{{ i18n.t(Labels.emptyTechniques) }}</p> }
  </div>
