<div class="mini-inventory" [attr.aria-label]="i18n.t(Labels.equipment)">
  @for (group of groups(); track group.kind) {
    <div class="mini-inventory-group" role="group" [attr.aria-label]="group.label">
      <app-ui-icon class="inventory-category" [name]="group.kind === 'weapons' ? 'weapons' : 'equipment'" />
      @for (slot of group.slots; track slot.index) {
        <button type="button" class="equipment-token" [class.is-empty]="!slot.id" [attr.data-equipment]="slot.id"
          [id]="'ninja-' + (ninjaIndex() + 1) + '-' + group.kind + '-' + (slot.index + 1)"
          aria-haspopup="dialog" [title]="slotLabel(group.kind, slot.index, slot.name)" [attr.aria-label]="slotLabel(group.kind, slot.index, slot.name)"
          (click)="dialogs.equipment(ninjaIndex(), group.kind, slot.index)"><app-ui-icon [name]="slot.id ? slot.icon : 'plus'" /></button>
      }
    </div>
  }
</div>
