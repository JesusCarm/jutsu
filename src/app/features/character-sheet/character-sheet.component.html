<section class="builder" aria-labelledby="squad-heading">
  <header class="editor-toolbar">
    <div class="editor-brand">
      <h1 id="squad-heading"><img class="editor-logo" [src]="logoUrl" [alt]="i18n.t(App.title)" width="512" height="512" /></h1>
      <span class="editor-subtitle">{{ i18n.t(App.subtitle) }}</span>
    </div>
    <div class="toolbar-actions">
      <app-rule-help rule="overview" [label]="i18n.t(Rules.title)" icon="book" [showLabel]="true" /><app-language-switcher /><app-theme-switcher /><app-pdf-toolbar />
    </div>
  </header>
  <form
    id="band-form"
    class="band-form"
    aria-labelledby="squad-heading"
    (submit)="$event.preventDefault()"
  >
    <div class="squad-bar">
      <app-band-name-editor />
    </div>
    <div class="ninja-grid">
      @for (ninja of state.band().ninjas; track $index) {
        <article
          class="ninja-column"
          [attr.aria-label]="
            ninja.name || i18n.t(Labels.ninja, { number: $index + 1 })
          "
        >
          <app-ninja-summary
            [ninja]="ninja"
            [index]="$index"
          />
          <div
            class="ninja-panel"
            [id]="'ninja-' + ($index + 1) + '-panel'"
            role="region"
            [attr.aria-label]="
              i18n.t(Labels.editNamedNinja, {
                name:
                  ninja.name || i18n.t(Labels.ninja, { number: $index + 1 }),
              })
            "
          >
            <app-ninja-editor [ninja]="ninja" [index]="$index" />
          </div>
        </article>
      }
    </div>
  </form>
  @if (i18n.error()) {
    <p role="status">{{ i18n.error() }}</p>
  }
  <app-pdf-actions />
</section>
