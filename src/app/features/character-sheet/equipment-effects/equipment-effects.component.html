@if (groups().length) {
  <details class="equipment-details">
    <summary>{{ i18n.t(Actions.viewEquipment) }}</summary>
    @for (group of groups(); track group.kind) {
      <section><h3>{{ group.label }}</h3>
        @for (slot of group.slots; track slot.index) {
          <div class="equipment-effect"><strong><app-ui-icon [name]="slot.icon" />{{ slot.name }}</strong><span class="action-cost">{{ slot.cost }}</span><p>{{ slot.description }}</p></div>
        }
      </section>
    }
  </details>
}
