<div class="ninja-summary">
  <div class="ninja-identity" [id]="'ninja-' + (index() + 1) + '-title'">
    <app-ninja-name-editor [value]="ninja().name" [ninjaIndex]="index()" />
    <button type="button" class="selection-trigger school-select" [class.has-value]="!!ninja().techniqueGroup.id" [id]="'ninja-' + (index() + 1) + '-technique-group'"
      aria-haspopup="dialog" [title]="ninja().techniqueGroup.id ? text.groupName(ninja().techniqueGroup.id) : i18n.t(Labels.selectSchool)"
      [attr.aria-label]="ninja().techniqueGroup.id ? i18n.t(Actions.changeSchool, {name: text.groupName(ninja().techniqueGroup.id)}) : i18n.t(Labels.selectSchool)" (click)="dialogs.school(index())">
      @if (ninja().techniqueGroup.id) {
        <app-ui-icon name="book" />
        <span class="selection-label">{{ text.groupName(ninja().techniqueGroup.id) }}</span>
      } @else { <span class="selection-label">{{ i18n.t(Labels.selectSchool) }}</span> }
    </button>
  </div>
  <button type="button" class="selection-trigger ninja-type" [class.has-value]="!!ninja().type" [id]="'ninja-' + (index() + 1) + '-type'" aria-haspopup="dialog"
    [title]="ninja().type ? i18n.t(Actions.changeType, {name: text.typeName(ninja().type)}) : i18n.t(Actions.chooseType)"
    (click)="dialogs.type(index())">
    @if (typeIcon(); as icon) { <app-ui-icon [name]="icon" /> }
    <span class="selection-label">{{ text.typeName(ninja().type) || i18n.t(Actions.chooseType) }}</span>
  </button>
  <app-stats-view [stats]="ninja().stats" />
  <app-equipment-summary [equipment]="ninja().equipment" [ninjaIndex]="index()" />
  <button type="button" class="ninja-details-button" [id]="'ninja-' + (index() + 1) + '-details'" aria-haspopup="dialog"
    [attr.aria-label]="i18n.t(Actions.viewNinjaDetails, {name: ninja().name || i18n.t(Labels.ninja, {number: index() + 1})})"
    (click)="dialogs.details(index())">{{ i18n.t(Actions.viewDetails) }}</button>
</div>
