<div class="ninja-summary" [class.is-active]="active()" (click)="select()">
  <div [id]="'ninja-' + (index() + 1) + '-title'">
    <button type="button" class="ninja-select" [id]="'ninja-' + (index() + 1) + '-select'"
      [attr.aria-pressed]="active()" [attr.aria-controls]="'ninja-' + (index() + 1) + '-panel'"
      [attr.aria-label]="i18n.t(Labels.editNamedNinja, {name: ninja().name || i18n.t(Labels.ninja, {number: index() + 1})})">
      <span class="ninja-name">{{ ninja().name || i18n.t(Labels.ninja, {number: index() + 1}) }}</span>
      <span class="ninja-type">
        @if (typeIcon(); as icon) { <app-ui-icon [name]="icon" /> }
        <span class="ninja-type-label">{{ text.typeName(ninja().type) || i18n.t(Labels.noType) }}</span>
      </span>
    </button>
    <h2 class="ninja-static-heading">
      <span class="ninja-name">{{ ninja().name || i18n.t(Labels.ninja, {number: index() + 1}) }}</span>
      <span class="ninja-type">
        @if (typeIcon(); as icon) { <app-ui-icon [name]="icon" /> }
        <span class="ninja-type-label">{{ text.typeName(ninja().type) || i18n.t(Labels.noType) }}</span>
      </span>
    </h2>
  </div>
  <app-stats-view [stats]="ninja().stats" />
  <app-equipment-summary [equipment]="ninja().equipment" />
</div>
