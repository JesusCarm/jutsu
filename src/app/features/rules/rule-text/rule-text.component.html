@for (part of parts(); track $index) {@if (part.rule; as id) {<button type="button" class="rule-keyword" [class.is-strong]="part.strong" [attr.data-rule-id]="id" [attr.aria-haspopup]="opensDialog() ? 'dialog' : null" [title]="i18n.t(Rules.view, {name: part.text})" [attr.aria-label]="i18n.t(Rules.view, {name: part.text})" (click)="$event.stopPropagation(); selectedRule.emit(id)">{{ part.text }}</button>} @else {@if (part.strong) {<strong>{{ part.text }}</strong>} @else {{{ part.text }}}}}
